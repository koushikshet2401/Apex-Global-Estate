<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Apex Global Estate</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#141311;--char:#1d1b18;--sand:#E9E2D6;--stone:#9b9285;--gold:#B79A64;--line:rgba(233,226,214,.2);--serif:'Marcellus','Times New Roman',serif;--sans:'Manrope',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--ink);color:var(--sand);font:300 16px/1.7 var(--sans);overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3,h4{font:400 1em/1.05 var(--serif)}video,img{display:block;max-width:100%}
.loader{position:fixed;inset:0;z-index:100;background:var(--ink);display:grid;place-items:center;transition:clip-path 1.2s cubic-bezier(.77,0,.18,1);clip-path:inset(0)}
.loader span{font:400 26px var(--serif);letter-spacing:.5em;animation:pl 1.3s ease-in-out infinite}.loaded .loader{clip-path:inset(0 0 100% 0)}@keyframes pl{50%{opacity:.3}}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:24px clamp(20px,4vw,56px);transition:.5s}
nav.s{background:rgba(20,19,17,.78);backdrop-filter:blur(14px);padding-block:14px}
.brand{font:400 19px var(--serif);letter-spacing:.34em}
nav ul{display:flex;gap:40px;list-style:none;padding:0;font-size:13px;letter-spacing:.1em}
.ul{position:relative;display:inline-block}.ul::after{content:"";position:absolute;left:0;bottom:-3px;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .5s cubic-bezier(.7,0,.2,1)}
.ul:hover::after,.ul:focus-visible::after{transform:scaleX(1);transform-origin:left}
.btn{display:inline-flex;align-items:center;gap:12px;padding:15px 30px;border:1px solid var(--sand);font-size:13px;letter-spacing:.12em;position:relative;overflow:hidden;z-index:0;transition:color .5s,border-color .5s}
.btn::before{content:"";position:absolute;inset:0;background:var(--gold);transform:translateY(101%);transition:transform .6s cubic-bezier(.2,.7,.2,1);z-index:-1}
.btn:hover{color:var(--ink);border-color:var(--gold)}.btn:hover::before{transform:none}.btn.solid{background:var(--sand);color:var(--ink)}
/* hero */
.hero{height:280svh}.hs{position:sticky;top:0;height:100svh;overflow:hidden}
.hs video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.hs::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,19,17,.82),rgba(20,19,17,0) 52%),linear-gradient(90deg,rgba(20,19,17,.5),rgba(20,19,17,0) 55%)}
.wm{position:absolute;z-index:2;left:clamp(14px,3vw,48px);bottom:2vh;font:400 clamp(110px,27vw,470px)/.86 var(--serif);display:flex;will-change:transform}
.c{display:inline-block;overflow:hidden;padding:.02em .015em .08em}.c i{display:block;font-style:normal;will-change:transform}
.tag{position:absolute;z-index:2;left:clamp(20px,4vw,56px);top:50%;font-size:12px;letter-spacing:.3em;color:var(--sand);display:flex;align-items:center;gap:16px;transition:opacity .3s}
.tag::before{content:"";width:48px;height:1px;background:var(--gold)}
.hl{position:absolute;z-index:3;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);bottom:clamp(28px,6vh,64px);display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:end;visibility:hidden}
.hl h1{font-size:clamp(30px,4.4vw,68px);text-shadow:0 2px 30px rgba(0,0,0,.35)}.hl p{max-width:420px;margin-bottom:22px;color:#F3EEE5}.hl .cta{display:flex;gap:14px;flex-wrap:wrap}
/* story */
.story{padding:clamp(100px,16vw,220px) clamp(20px,4vw,56px);background:var(--ink)}
.story p{font:400 clamp(26px,3.9vw,60px)/1.22 var(--serif);max-width:20em;margin-left:auto}.story .w{opacity:.16;transition:opacity .4s}.story .w.on{opacity:1}
/* destinations */
.head{padding:clamp(70px,10vw,140px) clamp(20px,4vw,56px) 56px;display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.head h2{font-size:clamp(38px,6vw,96px);max-width:9em}.head p{max-width:330px;color:var(--stone)}
.dest{position:relative;height:min(84svh,800px);min-height:560px;margin:0 clamp(20px,4vw,56px);display:flex;gap:8px;overflow:hidden}
.strip{position:relative;flex:1 1 0;min-width:0;overflow:hidden;cursor:pointer;transition:flex-grow 1s cubic-bezier(.77,0,.18,1),opacity .6s,margin .9s;margin-top:0}
.strip:nth-child(even){margin-top:56px}.strip:hover{flex-grow:1.9}
.dest.open .strip{margin-top:0}.dest.open .strip:not(.on){flex-grow:.0001;opacity:0;pointer-events:none}.dest.open .strip.on{flex-grow:1000;cursor:default}
.strip img{position:absolute;inset:-4%;width:108%;height:108%;max-width:none;object-fit:cover;transform:scale(1.12);transition:transform 1.8s cubic-bezier(.2,.7,.2,1),filter .9s,translate .6s;filter:brightness(.6)}
.strip:hover img{transform:scale(1.02);filter:brightness(.88)}.strip.on img{transform:none;filter:brightness(.5)}
.strip::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,19,17,.85),rgba(20,19,17,0) 55%);pointer-events:none}
.lab{position:absolute;z-index:2;left:22px;right:22px;bottom:24px;transition:opacity .4s}
.lab small{font-size:12px;letter-spacing:.14em;color:var(--sand);opacity:.85}.lab b{display:block;font:400 clamp(26px,2.6vw,40px)/1.1 var(--serif);white-space:nowrap;margin:4px 0 0;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.strip:hover .lab b{transform:translateY(-8px)}
.more{max-height:0;overflow:hidden;opacity:0;font-size:13px;line-height:1.5;transition:max-height .7s,opacity .6s .1s}.strip:hover .more{max-height:90px;opacity:1}
.cue{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:12px;letter-spacing:.16em}
.cue em{font-style:normal;width:44px;height:44px;border:1px solid var(--sand);border-radius:50%;display:grid;place-items:center;font-size:16px;transition:.5s cubic-bezier(.2,.8,.2,1)}
.strip:hover .cue em,.strip:focus-visible .cue em{background:var(--gold);border-color:var(--gold);color:var(--ink);transform:scale(1.25) rotate(-45deg)}
.cue span{position:relative}.cue span::after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .6s}.strip:hover .cue span::after{transform:scaleX(1)}
.dest.open .strip.on .lab{opacity:0}
.panel{position:absolute;z-index:3;inset:0;padding:clamp(24px,3.5vw,48px);display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;opacity:0;transition:opacity .5s}
.dest.open .panel{opacity:1;pointer-events:auto;transition-delay:.6s}
.panel .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.panel h3{font-size:clamp(44px,6.4vw,104px)}.panel .top p{max-width:300px;font-size:14px;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{position:relative;overflow:hidden;background:rgba(20,19,17,.66);backdrop-filter:blur(10px);border-top:1px solid var(--gold);opacity:0;transform:translateY(50px);transition:opacity .9s,transform 1s cubic-bezier(.2,.8,.2,1)}
.dest.open .card{opacity:1;transform:none}.dest.open .card:nth-child(1){transition-delay:.85s}.dest.open .card:nth-child(2){transition-delay:1s}.dest.open .card:nth-child(3){transition-delay:1.15s}
.ph{aspect-ratio:16/8;overflow:hidden;clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.77,0,.18,1)}.dest.open .ph{clip-path:inset(0);transition-delay:.9s}
.card img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}.card:hover img{transform:scale(1.08)}
.tx{padding:16px 18px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.card h4{font-size:20px}.card p{font-size:13px;color:#cfc7b9;margin-top:4px}
.card a{flex:none;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:.4s}.card a:hover{background:var(--gold);color:var(--ink);transform:rotate(-45deg)}
.back{padding:10px 20px;border:1px solid var(--line);font-size:13px;letter-spacing:.1em;background:rgba(20,19,17,.5)}.back:hover{border-color:var(--gold)}
.note{padding:18px clamp(20px,4vw,56px) 0;font-size:12px;color:var(--stone)}
#globe{position:absolute;right:16px;top:16px;width:140px;height:140px;pointer-events:none;z-index:4;transition:opacity .5s}.dest.open #globe{opacity:0}
/* final film */
.fin{height:220svh;margin-top:clamp(80px,12vw,160px)}.fs{position:sticky;top:0;height:100svh;overflow:hidden;background:var(--ink)}
.fv{position:absolute;inset:0;will-change:clip-path}.fv video{width:100%;height:100%;object-fit:cover;will-change:transform}
.fv::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,19,17,.8),rgba(20,19,17,0) 48%),linear-gradient(90deg,rgba(20,19,17,.45),rgba(20,19,17,0) 50%)}
.ft{position:absolute;z-index:2;left:clamp(20px,4vw,56px);bottom:clamp(32px,8vh,90px);max-width:640px}
.ft h2{font-size:clamp(36px,5.4vw,84px)}.ft p{margin:18px 0 26px;max-width:420px;color:#F3EEE5}
.ft>*{opacity:0;transform:translateY(34px);transition:1.2s cubic-bezier(.2,.8,.2,1)}.ft.on>*{opacity:1;transform:none}.ft.on>*:nth-child(2){transition-delay:.15s}.ft.on>*:nth-child(3){transition-delay:.3s}
/* contact */
.enq{display:grid;grid-template-columns:1fr 1fr;min-height:100svh}
.vis{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(28px,5vw,72px)}
.vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.1);transition:transform 2.4s cubic-bezier(.2,.7,.2,1)}.enq.in .vis img{transform:none}
.vis::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,19,17,.9),rgba(20,19,17,.05) 62%)}
.vis>div{position:relative;z-index:2}.vis h2{font-size:clamp(40px,5.4vw,88px);margin-bottom:22px}.vis dl{display:grid;gap:14px;font-size:14px;margin:0}.vis dt{font-size:11px;letter-spacing:.2em;color:var(--gold)}.vis dd{margin:0}
.fm{background:var(--sand);color:var(--ink);padding:clamp(48px,7vw,110px) clamp(24px,5vw,88px);display:flex;flex-direction:column;justify-content:center}
.fm>p{max-width:420px;margin-bottom:34px;color:#4a443b}
form{display:grid;gap:30px}.row{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.fld{position:relative;padding-top:18px}.fld::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.7,0,.2,1)}.fld:focus-within::after{transform:scaleX(1)}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid rgba(20,19,17,.3);border-radius:0;padding:10px 0;font-size:16px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0}
.fld label{position:absolute;left:0;top:30px;font-size:15px;color:#6a6358;pointer-events:none;transition:.4s cubic-bezier(.2,.8,.2,1);transform-origin:left}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label,.fld textarea:focus+label,.fld textarea:not(:placeholder-shown)+label,.fld select+label{transform:translateY(-26px) scale(.78);color:#7a5f2c}
.err{font-size:12px;color:#8a2c1e;min-height:1em;margin-top:4px}
.sub{align-self:start;display:inline-flex;gap:14px;align-items:center;padding:18px 36px;background:var(--ink);color:var(--sand);font-size:13px;letter-spacing:.14em;position:relative;overflow:hidden;z-index:0;transition:.4s}
.sub::before{content:"";position:absolute;inset:0;background:var(--gold);transform:translateX(-101%);transition:transform .6s cubic-bezier(.2,.7,.2,1);z-index:-1}.sub:hover{color:var(--ink)}.sub:hover::before,.busy .sub::before{transform:none}
.busy .sub{pointer-events:none;color:var(--ink)}
.done{display:none;font:400 clamp(26px,3vw,40px)/1.2 var(--serif)}.done small{display:block;font:300 14px var(--sans);margin-top:12px;color:#4a443b}.sent form,.sent .fm>p{display:none}.sent .done{display:block;animation:up 1s both}@keyframes up{from{opacity:0;transform:translateY(24px)}}
/* footer */
footer{position:relative;overflow:hidden;background:var(--char);padding:clamp(64px,8vw,110px) clamp(20px,4vw,56px) 0}
footer .bg{position:absolute;inset:0;opacity:.14;mask-image:linear-gradient(0deg,#000,transparent 80%);-webkit-mask-image:linear-gradient(0deg,#000,transparent 80%)}.bg img{width:100%;height:100%;object-fit:cover}
.cols{position:relative;display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:40px;font-size:14px}
.cols h5{font:500 11px var(--sans);letter-spacing:.2em;color:var(--gold);margin-bottom:16px}.cols ul{padding:0;list-style:none}.cols li{margin-bottom:9px}.cols p{color:#bdb5a7;max-width:300px}
.big{position:relative;display:flex;justify-content:center;font:400 clamp(90px,27vw,480px)/.82 var(--serif);margin-top:clamp(40px,6vw,90px)}
.big .c i{transform:translateY(105%);transition:transform 1.5s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*.1s)}footer.in .big .c i{transform:none}
.legal{position:relative;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--stone);padding:18px 0 22px;border-top:1px solid var(--line)}
@media(max-width:860px){nav ul{display:none}.hl{grid-template-columns:1fr;gap:16px}.hl p{display:none}.tag{display:none}
.dest{flex-direction:column;height:auto;min-height:0}.strip{flex:none;height:170px;margin-top:0!important}.strip:hover{flex-grow:0}.more{max-height:90px;opacity:1}.cue{margin-top:8px}
.dest.open{height:min(1240px,175svh)}.dest.open .strip:not(.on){height:0}.dest.open .strip.on{height:100%;flex-grow:1}
.cards{grid-template-columns:1fr;gap:10px}.card{display:grid;grid-template-columns:110px 1fr}.ph{aspect-ratio:auto;height:100%}.tx{padding:12px}.card a{display:none}
#globe{display:none}.enq{grid-template-columns:1fr}.vis{min-height:60svh}.row{grid-template-columns:1fr}.cols{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body>
